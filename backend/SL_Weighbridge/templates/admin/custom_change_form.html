{% extends "admin/change_form.html" %}
{% load static %}
{% block submit_buttons_bottom %}
    <div class="button-container" style="margin: 10px 0;">
        <button id="capture-weight-button" class="button capture-weight-button" style="
            background-color: #003366; /* Navy Blue */
            color: #ffffff; /* White Text */
            border: none; /* Remove border */
            padding: 8px 16px; /* Increased padding for better look */
            text-align: center; /* Center text */
            text-decoration: none; /* Remove underline */
            display: inline-block; /* Inline block for better control */
            font-size: 14px; /* Font size */
            margin: 4px 2px; /* Margin for spacing */
            cursor: pointer; /* Pointer cursor on hover */
            border-radius: 4px; /* Rounded corners */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Shadow effect */
            transition: background-color 0.3s, box-shadow 0.3s; /* Smooth transition */
        " type="button" data-transaction-id="{{ original.id }}">
            Capture Weight
        </button>

        <button id="reset-weight-button" class="button reset-weight-button" style="
            background-color: #ffcc00; /* Yellow */
            color: #000000; /* Black Text */
            border: none; /* Remove border */
            padding: 8px 16px; /* Increased padding for better look */
            text-align: center; /* Center text */
            text-decoration: none; /* Remove underline */
            display: inline-block; /* Inline block for better control */
            font-size: 14px; /* Font size */
            margin: 4px 2px; /* Margin for spacing */
            cursor: pointer; /* Pointer cursor on hover */
            border-radius: 4px; /* Rounded corners */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Shadow effect */
            transition: background-color 0.3s, box-shadow 0.3s; /* Smooth transition */
        " type="button">
            Reset Weight
        </button>

        <button id="print-receipt-button" class="button print-receipt-button" style="
            background-color: #28a745; /* Green */
            color: #ffffff; /* White Text */
            border: none; /* Remove border */
            padding: 8px 16px; /* Increased padding for better look */
            text-align: center; /* Center text */
            text-decoration: none; /* Remove underline */
            display: inline-block; /* Inline block for better control */
            font-size: 14px; /* Font size */
            margin: 4px 2px; /* Margin for spacing */
            cursor: pointer; /* Pointer cursor on hover */
            border-radius: 4px; /* Rounded corners */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Shadow effect */
            transition: background-color 0.3s, box-shadow 0.3s; /* Smooth transition */
        " type="button">
            Print Receipt
        </button>
    </div>
    {{ block.super }}
{% endblock %}

{% block extrahead %}
    {{ block.super }}
    <script src="{% static 'admin/js/capture_weight.js' %}"></script>
{% endblock %}
