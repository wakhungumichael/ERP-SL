<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Transaction Report</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #000;
            padding: 6px;
            font-size: 12px;
        }
        th {
            background-color: #eee;
        }
    </style>
</head>
<body>
    <h2>Transaction Report</h2>
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Date</th>
                <th>Customer</th>
                <th>Item</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody>
            {% for txn in transactions %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>{{ txn.date }}</td>
                <td>{{ txn.customer_name }}</td>
                <td>{{ txn.item }}</td>
                <td>{{ txn.amount }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="5">No transactions found.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
