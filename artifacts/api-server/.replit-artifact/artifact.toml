kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "bash -c 'cd ../../backend && export DJANGO_SETTINGS_MODULE=SL_ERP.settings && python manage.py migrate --no-input 2>&1 || true && exec python manage.py runserver 0.0.0.0:8080'"

[services.production]

[services.production.build]
args = ["echo", "no-build-step"]

[services.production.run]
args = ["bash", "-c", "cd ../../backend && export DJANGO_SETTINGS_MODULE=SL_ERP.settings && exec gunicorn SL_ERP.wsgi:application --bind 0.0.0.0:8080"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/healthz"
