# Retain the scheme supplied by the host TLS proxy. Direct HTTP deployments
# fall back to the container request scheme.
map $http_x_forwarded_proto $erp_request_scheme {
    default $scheme;
    https https;
    http http;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    root /usr/share/nginx/html;
    index index.html;

    # PDF.js uses an ES module worker. The default Nginx MIME table only
    # recognizes .js, so explicitly serve .mjs as JavaScript.
    location ~ ^/assets/.*\.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location /static/ {
        alias /srv/static/;
        expires 7d;
    }

    location /media/ {
        alias /srv/media/;
        expires 1d;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $erp_request_scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $erp_request_scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
