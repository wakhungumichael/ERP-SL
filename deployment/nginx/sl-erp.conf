server {
    listen 80;
    server_name erp.siakoralabs.co.ke 217.21.122.58;

    client_max_body_size 20M;

    # PDF.js uses an ES module worker. The default Nginx MIME table only
    # recognizes .js, so explicitly serve .mjs as JavaScript.
    location ~ ^/assets/.*\.mjs$ {
        root /srv/sl-erp/artifacts/erp-ui/dist/public;
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location /static/ {
        alias /srv/sl-erp/backend/staticfiles/;
    }

    location /media/ {
        alias /srv/sl-erp/backend/media/;
    }

    location / {
        root /srv/sl-erp/artifacts/erp-ui/dist/public;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
