name: CI

on:
  push:
    branches:
      - main
      - staging
      - develop
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack
        run: corepack enable

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Install system libraries for PDF and PostgreSQL packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpq-dev \
            libcairo2 \
            libffi-dev \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            shared-mime-info

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install Python dependencies
        run: uv sync

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Django system check
        working-directory: backend
        run: ../.venv/bin/python manage.py check

      - name: Migration drift check
        working-directory: backend
        run: ../.venv/bin/python manage.py makemigrations --check --dry-run

      - name: Backend test suite
        working-directory: backend
        run: ../.venv/bin/python manage.py test --settings=SL_ERP.settings_sqlite_tests

      - name: Frontend typecheck
        run: pnpm run typecheck

      - name: Frontend production build
        run: pnpm --filter @workspace/erp-ui run build
