services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sl_erp}
      POSTGRES_USER: ${POSTGRES_USER:-sl_erp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sl_erp_user} -d ${POSTGRES_DB:-sl_erp}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: deployment/docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sl_erp_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sl_erp}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      USE_X_FORWARDED_HOST: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - static_data:/app/backend/staticfiles
      - media_data:/app/backend/media

  celery-worker:
    build:
      context: .
      dockerfile: deployment/docker/backend.Dockerfile
    restart: unless-stopped
    command: ["/app/deployment/docker/run-celery-worker.sh"]
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sl_erp_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sl_erp}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery-beat:
    build:
      context: .
      dockerfile: deployment/docker/backend.Dockerfile
    restart: unless-stopped
    command: ["/app/deployment/docker/run-celery-beat.sh"]
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sl_erp_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sl_erp}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: deployment/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/}
        BASE_PATH: ${BASE_PATH:-/}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
